name: MV3 Chromium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mv3-chromium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build on Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Clone repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.19.1

      - name: Install lint dependencies
        run: npm ci

      - name: Test MV3 source invariants
        run: npm test

      - name: Lint MV3 source
        run: npm run lint

      - name: Build MV3 Chromium package
        shell: pwsh
        run: >-
          ./tools/make-mv3.ps1 -Platform chromium
          -Version "1.0.${{ github.run_number }}.${{ github.run_attempt }}"

      - name: Validate MV3 Chromium artifact
        run: node tools/validate-mv3.mjs dist/build/uBOLite.chromium --release

      - name: Upload unpacked extension and zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uBlock-Plus-chromium-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/build/uBOLite.chromium/
            dist/build/uBlock-Plus_*.chromium.zip
            dist/build/uBlock-Plus_*.chromium.zip.sha256
