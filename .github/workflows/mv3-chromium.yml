name: MV3 Chromium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mv3-chromium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build on Windows
    runs-on: windows-latest
    # The builds check every stock regex with Chrome, and the packages are
    # tested in Chrome.
    timeout-minutes: 60

    steps:
      - name: Clone repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.19.1

      - name: Install lint dependencies
        run: npm ci

      - name: Test MV3 source invariants
        run: npm test

      - name: Lint MV3 source
        run: npm run lint

      - name: Build MV3 Chromium package
        id: chromium
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          ./tools/make-mv3.ps1 -Platform chromium -Version $version

      - name: Validate MV3 Chromium artifact
        run: node tools/validate-mv3.mjs dist/build/uBlockPlus.chromium --release

      # windows-latest ships Google Chrome. Each test uses a fresh temporary
      # profile, closes the Chrome it started and has its own hard timeout.
      - name: Test static regex rules in Chrome
        timeout-minutes: 10
        run: node tools/test-static-regex-chrome.mjs --extension dist/build/uBlockPlus.chromium --output dist/chrome-tests/static-regex-chrome.json

      - name: Test strict blocking in Chrome
        timeout-minutes: 15
        run: node tools/test-strictblock-chrome.mjs --extension dist/build/uBlockPlus.chromium --output dist/chrome-tests/strictblock-chrome.json

      - name: Upload unpacked extension and zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uBlock-Plus-chromium-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/build/uBlockPlus.chromium/
            dist/build/uBlock-Plus_${{ steps.chromium.outputs.version }}.chromium.zip
            dist/build/uBlock-Plus_${{ steps.chromium.outputs.version }}.chromium.zip.sha256

      - name: Build experimental WebRequest package
        shell: pwsh
        run: ./tools/make-mv3.ps1 -Platform chromium -Version '${{ steps.chromium.outputs.version }}' -ExperimentalWebRequest

      - name: Validate experimental WebRequest artifact
        run: node tools/validate-mv3.mjs dist/build/uBlockPlus.experimental.chromium --release --experimental-webrequest

      - name: Test experimental static regex rules in Chrome
        timeout-minutes: 10
        run: node tools/test-static-regex-chrome.mjs --extension dist/build/uBlockPlus.experimental.chromium --output dist/chrome-tests/static-regex-chrome.experimental.json

      # The experimental package learns blocked addresses from webRequest.
      - name: Test experimental strict blocking in Chrome
        timeout-minutes: 10
        run: node tools/test-strictblock-chrome.mjs --extension dist/build/uBlockPlus.experimental.chromium --measure-seconds 0 --output dist/chrome-tests/strictblock-chrome.experimental.json

      - name: Upload Chrome test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chrome-test-reports-${{ github.sha }}
          if-no-files-found: ignore
          path: dist/chrome-tests/

      - name: Upload experimental extension and launcher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uBlock-Plus-experimental-webrequest-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/build/uBlockPlus.experimental.chromium/
            dist/build/uBlock-Plus_${{ steps.chromium.outputs.version }}.experimental.chromium.zip
            dist/build/uBlock-Plus_${{ steps.chromium.outputs.version }}.experimental.chromium.zip.sha256
