<!DOCTYPE html>
<html id="uBO-popup-panel" class="desktop">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/default.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/fa-icons.css">
<link rel="stylesheet" href="css/power-ui.css">
<link rel="stylesheet" href="css/popup.css">
<title data-i18n="extName"></title>
</head>

<body class="loading busy">
<main>
    <header class="popupHeader">
        <img src="img/icon_32.png" alt="">
        <strong data-i18n="extName">_</strong>
        <span id="version"></span>
    </header>

    <section class="protectionCard">
        <div id="hostname"><span></span>&shy;<span></span></div>
        <div class="protectionControl">
            <button id="sitePower" class="sitePower fa-icon" type="button" role="switch" aria-checked="false" disabled aria-label="popupPowerToggle" data-i18n-title="popupPowerToggle">power-off</button>
            <button id="refresh" class="iconButton fa-icon" type="button" data-i18n-title="popupReloadPage">refresh</button>
        </div>
        <div class="protectionCopy"><strong id="protectionStatus" aria-live="polite">_</strong><span id="protectionMode">_</span></div>
    </section>

    <section class="quickTools needHTTP" aria-label="popupQuickTools">
        <button id="gotoZapper" class="tool" type="button" data-i18n-title="zapperTipEnter"><span class="fa-icon">bolt</span><span class="caption" data-i18n="zapperTipEnter">_</span></button>
        <button id="gotoPicker" class="tool" type="button" data-i18n-title="pickerTipEnter"><span class="fa-icon">eye-dropper</span><span class="caption" data-i18n="pickerTipEnter">_</span></button>
        <button id="gotoUnpicker" class="tool" type="button" data-i18n-title="unpickerTipEnter"><span class="fa-icon">eye-open</span><span class="caption" data-i18n="unpickerTipEnter">_</span></button>
        <button id="gotoReport" class="tool" type="button" data-i18n-title="popupTipReport"><span class="fa-icon">comment-alt</span><span class="caption" data-i18n="popupTipReport">_</span></button>
        <button id="gotoDashboard" class="tool enabled" type="button" data-i18n-title="popupTipDashboard"><span class="fa-icon">cogs</span><span class="caption" data-i18n="popupTipDashboard">_</span></button>
    </section>

    <section class="capabilityGrid powerDetails" aria-label="popupCapabilitySummary">
        <div data-capability="network"><span data-i18n="popupCapabilityNetwork">_</span><strong>_</strong></div>
        <div data-capability="extended"><span data-i18n="popupCapabilityExtended">_</span><strong>_</strong></div>
        <div data-capability="popup"><span data-i18n="popupCapabilityPopups">_</span><strong>_</strong></div>
        <div data-capability="lists"><span data-i18n="popupCapabilityLists">_</span><strong>_</strong></div>
    </section>

    <section id="siteControls" class="powerDetails needHTTP">
        <h2 data-i18n="popupSiteControls">_</h2>
        <div class="siteMode">
            <label for="siteFilteringMode" data-i18n="popupFilteringModeLabel">_</label>
            <select id="siteFilteringMode" disabled>
                <option value="1" data-i18n="filteringMode1Name">_</option>
                <option value="2" data-i18n="filteringMode2Name">_</option>
                <option value="3" data-i18n="filteringMode3Name">_</option>
            </select>
        </div>
        <div id="popupPolicy" class="popupPolicy">
            <label for="popupPolicySelect" data-i18n="popupPolicyLabel">_</label>
            <select id="popupPolicySelect" disabled>
                <option value="default" data-i18n="popupPolicyDefault">_</option>
                <option value="allow" data-i18n="popupPolicyAllow">_</option>
                <option value="block" data-i18n="popupPolicySmart">_</option>
                <option value="strict" data-i18n="popupPolicyStrict">_</option>
            </select>
            <p data-i18n="popupPolicyDescription">_</p>
        </div>
    </section>

    <nav class="dashboardLinks powerDetails" aria-label="popupSiteControls">
        <button id="gotoMyFilters" type="button" data-i18n="myFiltersPageName">_</button>
        <button id="gotoSiteRules" type="button" data-i18n="siteRulesPageName">_</button>
    </nav>

    <div class="operationStatus">
        <p id="popupError" role="status" aria-live="polite"></p>
        <button id="retryPopup" type="button" hidden data-i18n="popupRetry">_</button>
    </div>

    <footer class="toolRibbon">
        <button id="gotoMatchedRules" class="tool fa-icon" type="button" data-i18n-title="popupMatchedRules">list-alt<span class="caption" data-i18n="popupMatchedRules"></span></button>
        <button id="gotoDashboardFooter" class="tool enabled fa-icon" type="button" data-i18n-title="popupTipDashboard">cogs<span class="caption" data-i18n="popupTipDashboard"></span></button>
        <span id="popupActivity" class="popupActivity powerDetails"></span>
        <button id="toggleDetails" type="button" aria-expanded="true" aria-controls="siteControls" data-i18n="popupLess">_</button>
    </footer>
</main>

<aside aria-hidden="true"><span class="fa-icon">spinner</span></aside>
<script src="js/theme.js" type="module"></script>
<script src="js/fa-icons.js" type="module"></script>
<script src="js/i18n.js" type="module"></script>
<script src="js/popup.js" type="module"></script>
</body>
</html>
